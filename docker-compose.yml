services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: agent_atlas
    ports:
      - "5433:5432"
    volumes:
      - atlas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d agent_atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  atlas_pg:
